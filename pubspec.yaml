name: faras_quran_ai
description: Yahia Quran Academy — Quran memorization for children: listen to a verified reciter, repeat, record, and review with a parent.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Backend
  supabase_flutter: ^2.8.0

  # Audio
  just_audio: ^0.9.42
  record: ^7.1.0

  # Local storage (JSON file-based, avoids Isar codegen conflicts)
  path_provider: ^2.1.5

  # Routing
  go_router: ^14.8.1

  # HTTP
  http: ^1.2.2

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  web_socket_channel: ^3.0.1
  fl_chart: ^0.69.2
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/data/quran_text.json
    - assets/data/audio_manifest.json
    - assets/data/recitation_manifest.json

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Variable.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
