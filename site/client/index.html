<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Site-level defaults. The app replaces these per route via React 19's
         metadata hoisting, and functions/_middleware.ts stamps the same values
         in for crawlers that never run JavaScript. Both read client/src/lib/
         page-meta.ts, so all three stay in step. -->
    <!-- Placeholders. functions/_middleware.ts replaces this whole block per
         route for crawlers; in a browser React 19 renders the same values from
         client/src/lib/page-meta.ts. Keep the marker comments — the middleware
         matches on them. -->
    <!--meta:start-->
    <title data-default>أكاديمية يحيى لتعليم القرآن للأطفال</title>
    <meta data-default name="description" content="قراءة القرآن بالنص العثماني مع تلاوات معلّمة موثقة، وقصص من القرآن للأطفال في أربعة أبواب." />
    <meta data-default property="og:type" content="website" />
    <meta data-default property="og:site_name" content="أكاديمية يحيى لتعليم القرآن للأطفال" />
    <meta data-default property="og:locale" content="ar_AR" />
    <meta data-default property="og:title" content="أكاديمية يحيى لتعليم القرآن للأطفال" />
    <meta data-default property="og:description" content="قراءة القرآن بالنص العثماني مع تلاوات معلّمة موثقة، وقصص من القرآن للأطفال." />
    <meta data-default property="og:image" content="https://yahyaquran.com/og-yahya.jpg" />
    <meta data-default property="og:url" content="https://yahyaquran.com/" />
    <meta data-default name="twitter:card" content="summary_large_image" />
    <meta data-default name="twitter:title" content="أكاديمية يحيى لتعليم القرآن للأطفال" />
    <meta data-default name="twitter:description" content="قراءة القرآن بالنص العثماني مع تلاوات معلّمة موثقة، وقصص من القرآن للأطفال." />
    <meta data-default name="twitter:image" content="https://yahyaquran.com/og-yahya.jpg" />
    <!--meta:end-->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#001F3F" />
    <!-- Fonts are ours, not Google's: no DNS lookup and no TLS handshake to two
         more origins before Arabic can paint. scripts/fetch-fonts.mjs writes
         public/fonts. naskh-1 carries the Arabic range and jakarta-9 the Latin
         one; both are above the fold on every page — the Arabic in the body,
         the wordmark in the header. Without preloading, the first visit paints
         in a fallback face and reflows when the real one lands. -->
    <link rel="preload" href="/fonts/naskh-1.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jakarta-9.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Optional Umami analytics: re-add one line here only after setting
         VITE_ANALYTICS_ENDPOINT + VITE_ANALYTICS_WEBSITE_ID in Cloudflare
         Pages, and add the endpoint to CSP connect-src in public/_headers. -->
  </body>

</html>
